name: Deploy Backend Sapo_Clone

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    # Khai báo toàn bộ secrets thành biến môi trường cho JOB
    # Đây là cách CHUẨN để truyền secrets trong GitHub Actions
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GOONG_API_KEY: ${{ secrets.GOONG_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

    steps:
      # ---------------------------------------------------------------
      # BƯỚC NÀY PHẢI ĐẦU TIÊN: Kill Java trước khi checkout
      # Lý do: Java đang chạy giữ file lock trên thư mục workspace
      # (đặc biệt các file trong target/). Git không thể xóa/ghi đè
      # các file đang bị lock → checkout thất bại.
      # continue-on-error: true để không fail nếu Java chưa chạy.
      # ---------------------------------------------------------------
      - name: 0. Dừng Java cũ trước khi checkout (tránh lỗi file lock)
        run: taskkill /F /IM java.exe /T
        continue-on-error: true

      - name: 1. Kéo code mới nhất từ GitHub về máy chủ
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: 3. Tạo file .env từ GitHub Secrets
        shell: powershell
        run: |
          $lines = @(
            "DB_URL=$env:DB_URL",
            "DB_USERNAME=$env:DB_USERNAME",
            "DB_PASSWORD=$env:DB_PASSWORD",
            "JWT_SECRET=$env:JWT_SECRET",
            "CLOUDINARY_CLOUD_NAME=$env:CLOUDINARY_CLOUD_NAME",
            "CLOUDINARY_API_KEY=$env:CLOUDINARY_API_KEY",
            "CLOUDINARY_API_SECRET=$env:CLOUDINARY_API_SECRET",
            "GOONG_API_KEY=$env:GOONG_API_KEY",
            "MAIL_USERNAME=$env:MAIL_USERNAME",
            "MAIL_PASSWORD=$env:MAIL_PASSWORD",
            "ALLOWED_ORIGINS=$env:ALLOWED_ORIGINS"
          )
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) ".env"), $lines, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Da tao file .env thanh cong!"

      - name: 4. Kiểm tra .env (che giá trị, chỉ hiện key)
        shell: powershell
        run: |
          Write-Host "--- Cac bien trong .env ---"
          Get-Content .env | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Length -eq 2) {
              $val = if ($parts[1].Length -gt 4) { $parts[1].Substring(0,4) + "****" } else { "****" }
              Write-Host "$($parts[0])=$val"
            }
          }
          Write-Host "---------------------------"

      - name: 5. Đóng gói dự án (Build file JAR)
        run: .\mvnw.cmd clean package -DskipTests

      - name: 7. Khởi động lại máy chủ Backend
        shell: powershell
        run: |
          # Tìm file jar động (không hardcode tên)
          $jarFile = Get-ChildItem -Path target\*.jar -Exclude "*sources*","*javadoc*" | Select-Object -First 1
          if (-not $jarFile) {
              Write-Error "Khong tim thay file .jar trong thu muc target!"
              exit 1
          }

          $workDir = (Get-Location).Path
          $envFile = Join-Path $workDir ".env"
          $logDir = Join-Path $workDir "logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $outLog = Join-Path $logDir "backend-out.log"
          $errLog = Join-Path $logDir "backend-error.log"
          $pidFile = Join-Path $logDir "backend.pid"
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          if (Test-Path $outLog) {
              Move-Item -Force $outLog (Join-Path $logDir "backend-out-$timestamp.log")
          }
          if (Test-Path $errLog) {
              Move-Item -Force $errLog (Join-Path $logDir "backend-error-$timestamp.log")
          }

          Write-Host "Chay jar: $($jarFile.FullName)"
          Write-Host "Thu muc lam viec: $workDir"
          Write-Host "File .env: $envFile"
          Write-Host "Log stdout: $outLog"
          Write-Host "Log stderr: $errLog"

          # Xoa tracking de GitHub Runner khong kill process sau khi job ket thuc
          $env:RUNNER_TRACKING_ID = ""
          [Environment]::SetEnvironmentVariable("RUNNER_TRACKING_ID", "", "Process")

          $process = Start-Process `
            -FilePath "java" `
            -ArgumentList @(
              "-jar", "`"$($jarFile.FullName)`"",
              "--spring.config.import=optional:file:$envFile[.properties]"
            ) `
            -WorkingDirectory $workDir `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -WindowStyle Hidden `
            -PassThru

          Set-Content -Path $pidFile -Value $process.Id -Encoding UTF8
          Write-Host "Backend PID: $($process.Id)"
          Write-Host "PID file: $pidFile"

          $portReady = $false
          for ($i = 1; $i -le 60; $i++) {
              if ($process.HasExited) {
                  Write-Error "Backend vua khoi dong da bi dung. ExitCode=$($process.ExitCode)"
                  Write-Host "--- backend-out.log ---"
                  if (Test-Path $outLog) { Get-Content $outLog -Tail 150 }
                  Write-Host "--- backend-error.log ---"
                  if (Test-Path $errLog) { Get-Content $errLog -Tail 150 }
                  exit 1
              }

              $connection = Test-NetConnection -ComputerName "127.0.0.1" -Port 8080 -WarningAction SilentlyContinue
              if ($connection.TcpTestSucceeded) {
                  $portReady = $true
                  break
              }

              Write-Host "Dang doi backend mo cong 8080... lan $i/60"
              Start-Sleep -Seconds 2
          }

          if (-not $portReady) {
              Write-Error "Backend process con song nhung cong 8080 chua mo sau 120 giay."
              Write-Host "--- backend-out.log ---"
              if (Test-Path $outLog) { Get-Content $outLog -Tail 200 }
              Write-Host "--- backend-error.log ---"
              if (Test-Path $errLog) { Get-Content $errLog -Tail 200 }
              if (Get-Command jcmd -ErrorAction SilentlyContinue) {
                  $threadDump = Join-Path $logDir "thread-dump-$timestamp.txt"
                  jcmd $process.Id Thread.print | Out-File -FilePath $threadDump -Encoding UTF8
                  Write-Host "Thread dump: $threadDump"
              }
              exit 1
          }

          Write-Host "Backend da khoi dong thanh cong!"
          Write-Host "Cong 8080 da san sang."

          Write-Host "Bat dau theo doi va in truc tiep log backend-out.log trong 5 phut..."
          $lastLineCount = 0
          for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path $outLog) {
                  $lines = Get-Content $outLog -ErrorAction SilentlyContinue
                  if ($lines) {
                      $currentCount = $lines.Count
                      if ($currentCount -gt $lastLineCount) {
                          $lines[$lastLineCount..($currentCount - 1)] | ForEach-Object { Write-Host $_ }
                          $lastLineCount = $currentCount
                      }
                  }
              }
              if ($process.HasExited) {
                  Write-Error "Backend bat ngo bi dung trong luc theo doi! ExitCode=$($process.ExitCode)"
                  if (Test-Path $errLog) { Get-Content $errLog -Tail 150 }
                  exit 1
              }
              Start-Sleep -Seconds 10
          }
          Write-Host "Da ket thuc 5 phut theo doi log."
