name: Deploy Backend Sapo_Clone

on:
  push:
    branches: [ "main" ] # Sửa lại thành 'master' hoặc nhánh bạn đang code nếu cần
    # paths:
    #   - 'backend/**' # Nếu code backend nằm trong thư mục riêng, hãy bỏ dấu # ở 2 dòng này và sửa tên thư mục

jobs:
  deploy:
    runs-on: self-hosted # Ra lệnh cho GitHub gửi việc về Máy B của bạn

    steps:
      - name: 1. Kéo code mới nhất từ GitHub về Máy B
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: 2.5 Dừng server cũ (Giải phóng file JAR đang bị khóa)
        run: taskkill /F /IM java.exe /T
        continue-on-error: true

      - name: 3. Đóng gói dự án (Build file JAR)
        run: .\mvnw.cmd clean package -DskipTests

      - name: 3. Đóng gói dự án (Build file JAR)
        run: .\mvnw.cmd clean package -DskipTests

      - name: 4. Khởi động lại máy chủ Backend
        shell: powershell
        run: |
          # Dừng tiến trình Java cũ đang chạy (nếu có)
          Stop-Process -Name java -Force -ErrorAction SilentlyContinue
          
          # Tìm file .jar mới trong thư mục target
          $jarFile = Get-ChildItem -Path target\*.jar | Select-Object -First 1
          if ($jarFile) {
              # Xóa tracking ID để GitHub Runner không kill tiến trình chạy ngầm sau khi job kết thúc
              $env:RUNNER_TRACKING_ID = $null
              Start-Process -FilePath "java" -ArgumentList "-jar `"$($jarFile.FullName)`"" -WindowStyle Hidden
              Write-Host "Da khoi dong lai Backend: $($jarFile.Name) thanh cong!"
          } else {
              Write-Error "Khong tim thay file jar trong thu muc target!"
              exit 1
          }