name: Deploy Backend Sapo_Clone

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Kéo code mới nhất từ GitHub về máy chủ
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
      - name: 2.3 Tự động tạo file .env từ GitHub Secrets
        shell: powershell
        run: |
            echo "DB_URL=${{ secrets.DB_URL }}" > .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
            echo "GOONG_API_KEY=${{ secrets.GOONG_API_KEY }}" >> .env
            echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env

      - name: 3. Dừng server cũ (giải phóng file JAR đang bị khóa)
        run: taskkill /F /IM java.exe /T
        continue-on-error: true

      - name: 4. Đóng gói dự án (Build file JAR)
        run: .\mvnw.cmd clean package -DskipTests

      - name: 4. Khởi động và xuất log chi tiết
        shell: powershell
        run: |
            # Đảm bảo chúng ta đang ở đúng nơi chứa file .env
            cd "C:\Users\Admin\actions-runner\_work\Sapo_Clone\Sapo_Clone\"
            
            # Chạy Java và ép buộc nó nạp biến môi trường từ hệ điều hành 
            # (Cách này an toàn hơn là trông chờ nó đọc file .env)
            java -jar target/Sapo_Clone-0.0.1-SNAPSHOT.jar `
              -DDB_URL="${{ secrets.DB_URL }}" `
              -DDB_USERNAME="${{ secrets.DB_USERNAME }}" `
              -DDB_PASSWORD="${{ secrets.DB_PASSWORD }}" `
              -DJWT_SECRET="${{ secrets.JWT_SECRET }}" `
              -DCLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" `
              -DCLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" `
              -DCLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" `
              -DGOONG_API_KEY="${{ secrets.GOONG_API_KEY }}" `
              -DMAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" `
              -DMAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" `
              -DALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" `
              > full_log.txt 2>&1

      - name: 6. Khởi động lại máy chủ Backend
        shell: powershell
        run: |
          $jarFile = Get-ChildItem -Path target\*.jar | Select-Object -First 1
          if ($jarFile) {
              $env:RUNNER_TRACKING_ID = $null
              Start-Process -FilePath "java" -ArgumentList "-jar `"$($jarFile.FullName)`"" -WindowStyle Hidden
              Write-Host "Da khoi dong lai Backend: $($jarFile.Name) thanh cong!"
          } else {
              Write-Error "Khong tim thay file jar trong thu muc target!"
              exit 1
          }