# Test DB (H2 in-memory) to run integration tests locally
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.main.allow-bean-definition-overriding=true
# Disable running data.sql during tests (schema created by Hibernate)
spring.sql.init.mode=never

# Provide dummy cloudinary/test secrets for test context
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test

# Dummy JWT secret (Base64) for tests
jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# JWT expiration (ms)
jwt.expiration=3600000