spring.application.name=Sapo_Clone

# ============================================================
# DATABASE SQL Server
# Fill in your connection details before running
# ============================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Sapo_Clone;encrypt=false
spring.datasource.username=sa
# Move secrets to environment variables. Set DB_PASSWORD in your environment.
spring.datasource.password=${DB_PASSWORD}


# ============================================================
# JPA / Hibernate
# ============================================================
# Use `update` for dev, `validate` or `none` for production. Do NOT keep `create` in prod.
spring.jpa.hibernate.ddl-auto= never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# ============================================================
# JWT Change secret before deploying to production!
# Secret must be Base64-encoded and at least 256 bits (32 bytes)
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================================================
# ============================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ============================================================
# Logging
# ============================================================
logging.level.com.example.Sapo_Clone=DEBUG
logging.level.org.springframework.security=INFO

# Allowed origins for CORS (comma-separated)
app.security.allowed-origins=http://localhost:3000,http://localhost:5173

# Auto run data.sql when setup
spring.sql.init.mode= never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

#API Key Goong
map.api.key=${API_GOONG_KEY}
map.api.base-url=https://rsapi.goong.io
#Config Timout of Goong
map.api.connect-timeout=5000
map.api.read-timeout=5000

# ============================================================
# REDIS
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=
# ============================================================
# EMAIL VERIFICATION (SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Custom verification settings
email.verification.ttl=15
email.verification.resend-limit=3
